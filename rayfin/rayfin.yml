id: marketing-data-chat
name: marketing-data-chat
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
    password:
      enabled: true
    allowedRedirectUris:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - https://early-wave-d05589855e-italynorth.webapp.fabricapps.net
  data:
    enabled: true
    dialect: mssql
  functions:
    enabled: true
    buildCommand: npm run build
  staticHosting:
    enabled: true
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
  storage:
    enabled: false
